name: Build Executables

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run test suite
      run: python test_suite.py

  build-windows:
    needs: test
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows executable
      run: python build_exe.py
    
    - name: Verify Windows executable
      run: |
        ./dist/CRM.exe --version
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: CRM-Windows
        path: dist/CRM.exe
        retention-days: 7

  build-macos:
    needs: test
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS application
      run: |
        pyinstaller \
          --onefile \
          --windowed \
          --name=CRM \
          --add-data="README.md:." \
          --hidden-import=tkcalendar \
          --hidden-import=babel.numbers \
          --collect-all=tkcalendar \
          --noconfirm \
          crm_app.py
    
    - name: Verify macOS application
      run: |
        # Run the binary inside the app bundle
        ./dist/CRM.app/Contents/MacOS/CRM --version
    
    - name: Create DMG
      run: |
        mkdir -p dist/dmg
        cp -r "dist/CRM.app" dist/dmg/
        hdiutil create -volname "CRM Installer" -srcfolder dist/dmg -ov -format UDZO dist/CRM.dmg
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CRM-macOS
        path: |
          dist/CRM.dmg
          dist/CRM.app
        retention-days: 7

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: CRM-Windows
        path: ./artifacts/windows
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: CRM-macOS
        path: ./artifacts/macos
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/windows/CRM.exe
          ./artifacts/macos/CRM.dmg
          ./artifacts/macos/CRM.app
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
